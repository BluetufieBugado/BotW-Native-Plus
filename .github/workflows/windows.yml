# Windows MinGW build. The Cafe runtime uses pthreads, so this is MSYS2 UCRT64 (gcc),
# not MSVC or clang-cl. generated/ is not in the repo, so the job links the guest stub.
# A green job means the runtime and the vendored Cemu layer compiled and linked.
# It does not launch the game (no dump, no GPU present test).
name: Windows (MinGW)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-glm
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-glslang
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel -- -k 0
      # The launchers do not need the game code, so they are usable from this build. The
      # BotWRecomp.exe here is the guest stub (no game), so it is left out of the download to
      # keep anyone from replacing a real build with it.
      - name: Package launchers
        run: |
          cmake --build build --target botw_package
          rm -f build/package/BotWRecomp.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BotW-Native-launchers-windows
          path: build/package
          retention-days: 14
